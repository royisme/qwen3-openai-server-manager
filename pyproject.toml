[project]
name = "qwen3-openai-server-manager"
version = "0.1.0"
description = "Local lifecycle manager for ParoQuant OpenAI-compatible API server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qwen3-server-manager = "qwen3_server_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qwen3_server_manager*"]

